name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare web folder
        run: | mkdir -p www cp index.html manifest.json sw.js icon.svg www/ 
      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Add native plugin and launcher activity
        run: | DEST=android/app/src/main/java/com/neon/launcher mkdir -p "$DEST" cp AppsPlugin.java MainActivity.java "$DEST/" python3 patch_manifest.py android/app/src/main/AndroidManifest.xml 
      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: | chmod +x gradlew ./gradlew assembleDebug --no-daemon 
      - uses: actions/upload-artifact@v4
        with:
          name: NeonLauncher-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
